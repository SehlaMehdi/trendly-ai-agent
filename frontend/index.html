<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trendly AI Customer Support</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <h2>Trendly Support Assistant</h2>
            <p>Ask about orders, returns, refunds & store policy</p>
        </header>

        <div id="chat-messages" class="chat-messages">
            <div class="message bot-message">
                Hello! 👋 I'm your Trendly Support Assistant. How can I help you with your order or shipping policy today?
            </div>
        </div>

        <form id="chat-form" class="chat-input-area">
            <input type="text" id="user-input" placeholder="Ask a question or enter Order ID (e.g., TR-4521)..." required autocomplete="off">
            <button type="submit" id="send-btn">Send</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
